<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema da Empresa</title>
    <link rel="icon" type="image/png" href="/static/uploads/logo.png">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/vendor/tailwind.js"></script>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen p-4">

    <div class="bg-slate-900 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-800">
        <div class="text-center mb-8">
            <img src="/static/uploads/logo.png" alt="Logo" class="mx-auto max-w-[140px] h-auto mb-4 rounded-xl" onerror="this.style.display='none'">
            <h1 class="text-2xl font-black text-amber-400 tracking-wide uppercase">Acesso ao Sistema</h1>
            <p class="text-xs text-slate-400 mt-1">Ambiente 100% Local • Digite suas credenciais</p>
        </div>

        {% if error %}
        <div class="bg-rose-950/80 border border-rose-700 text-rose-300 px-4 py-3 rounded-xl mb-6 text-sm text-center font-semibold">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1.5">Usuário / Atendente</label>
                <input type="text" name="username" required placeholder="Ex: Thaissa, Michel, Davi..." class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-slate-100 focus:outline-none focus:border-amber-400 transition text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1.5">Senha</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-slate-100 focus:outline-none focus:border-amber-400 transition text-sm">
            </div>

            <button type="submit" class="w-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-black py-3 rounded-xl shadow-lg transition cursor-pointer">
                Entrar no Sistema
            </button>
        </form>
    </div>

</body>
</html>
