{% extends "base.html" %}

{% block title %}Produtos - Sistema da Empresa{% endblock %}

{% block content %}
<div class="p-8 space-y-8 bg-slate-950 w-full min-h-screen text-slate-100 pb-16">

    <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-800 pb-4 gap-4">
        <div>
            <h1 class="text-3xl font-black text-amber-400 tracking-wide flex items-center gap-3">
                🏷️ PRODUTOS & QUANTIDADES
            </h1>
            <p class="text-sm text-slate-400 mt-1">Gerencie seu estoque e tabela de preços.</p>
        </div>

        <button onclick="abrirModalProduto()" class="bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold px-5 py-2.5 rounded-xl transition flex items-center gap-2 shadow-lg shadow-amber-400/10 cursor-pointer">
            ➕ Novo Produto
        </button>
    </div>

    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col md:flex-row gap-4 justify-between items-center shadow-xl">
        <div class="relative w-full md:w-96">
            <input type="text" id="input-busca-produto" onkeyup="filtrarProdutos()" placeholder="Buscar produto..." class="w-full bg-slate-950 border border-slate-700 text-slate-100 text-sm rounded-xl pl-10 pr-4 py-2.5 outline-none focus:border-amber-400 transition">
            <span class="absolute left-3.5 top-2.5 text-slate-500">🔍</span>
        </div>
        <div class="text-xs text-slate-400">
            Total de Produtos: <span id="total-produtos-count" class="font-bold text-amber-400">0</span>
        </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-slate-300">
                <thead class="bg-slate-950 text-slate-400 uppercase text-xs border-b border-slate-800">
                    <tr>
                        <th class="p-4">Cód.</th>
                        <th class="p-4">Nome do Produto</th>
                        <th class="p-4">Preço de Venda</th>
                        <th class="p-4">Quantidade / Estoque</th>
                        <th class="p-4 text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-produtos-body" class="divide-y divide-slate-800/60">
                    </tbody>
            </table>
        </div>
    </div>

</div>

<div id="modal-produto" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl shadow-2xl p-6 space-y-6">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
            <h2 id="modal-produto-titulo" class="text-xl font-bold text-amber-400">Novo Produto</h2>
            <button onclick="fecharModalProduto()" class="text-slate-400 hover:text-white text-xl">✕</button>
        </div>

        <form id="form-produto" onsubmit="salvarProduto(event)" class="space-y-4">
            <input type="hidden" id="produto-id">

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Nome do Produto *</label>
                <input type="text" id="produto-nome" required class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-4 py-2.5 outline-none focus:border-amber-400">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Preço de Venda (R$) *</label>
                    <input type="number" step="0.01" id="produto-preco" required placeholder="0.00" class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-4 py-2.5 outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Quantidade em Estoque *</label>
                    <input type="number" id="produto-quantidade" required placeholder="0" class="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-4 py-2.5 outline-none focus:border-amber-400">
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
                <button type="button" onclick="fecharModalProduto()" class="px-4 py-2.5 rounded-xl border border-slate-700 text-slate-300 font-bold hover:bg-slate-800 transition">Cancelar</button>
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-amber-400 text-slate-950 font-bold hover:bg-amber-300 transition">Salvar Produto</button>
            </div>
        </form>
    </div>
</div>

<script type="module" src="/static/js/produtos.js"></script>
{% endblock %}
